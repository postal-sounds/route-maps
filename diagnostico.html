<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Postal Sounds: diagnóstico del mapa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 32px; background: #161817; color: #E2E2D8;
    font-family: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.4;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 20px; color: #BFEF2B; }
  p { margin: 0 0 14px; }
  ul { list-style: none; margin: 0 0 14px; padding: 0; }
  li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 12px; margin-bottom: 6px; border-radius: 10px; background: #232320;
  }
  .ok { color: #BFEF2B; }
  .bad { color: #FF8A7A; font-weight: 700; }
  .wait { color: #9A9A90; }
  .value { text-align: right; white-space: nowrap; }
  #verdict { padding: 12px; border-radius: 10px; background: #E2E2D8; color: #232320; font-weight: 700; }
  #device { font-size: 12px; color: #9A9A90; word-break: break-word; }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #BFEF2B; color: #232320;
    font: inherit; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>Diagnóstico del mapa</h1>
  <p>Espera unos segundos y envíanos una captura de esta pantalla. No se envía ningún dato: todo se queda en tu teléfono.</p>
  <ul id="results"></ul>
  <p id="verdict">Comprobando...</p>
  <p id="device"></p>
  <button id="copy" type="button">Copiar resultado</button>
</main>
<script>
const TIMEOUT_MS = 12000;
const SUPABASE_URL = 'https://jwwwekafkpjdtngtjzfe.supabase.co/rest/v1/spots?select=id&limit=1';
const SUPABASE_KEY = 'sb_publishable_ypy8gKygTS_JJSin3HVdyQ_-aJWXvtc';
const CHECKS = [
  { name: 'Cuentas (jsDelivr)', key: 'accounts', url: 'https://cdn.jsdelivr.net/npm/@framerauth/sdk@2/dist/framerauth.js' },
  { name: 'Página (Framer)', key: 'site', url: 'https://postalsounds.com/' },
  { name: 'Mapa (Mapbox)', key: 'map', url: 'https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js' },
  { name: 'Datos (Supabase)', key: 'data', url: SUPABASE_URL, headers: { apikey: SUPABASE_KEY } },
  { name: 'Fotos (Cloudinary)', key: 'photos', url: 'https://res.cloudinary.com/dessz21gt/image/upload/w_10/v1770659438/apolo-1_slq2uh.jpg' }
];
const lines = [];

function addRow(name) {
  const row = document.createElement('li');
  const label = document.createElement('span');
  label.textContent = name;
  const value = document.createElement('span');
  value.className = 'value wait';
  value.textContent = '...';
  row.append(label, value);
  document.getElementById('results').appendChild(row);
  return value;
}

function showResult(cell, name, ok, text) {
  cell.className = 'value ' + (ok ? 'ok' : 'bad');
  cell.textContent = text;
  lines.push(name + ': ' + text);
}

async function runCheck(check) {
  const cell = addRow(check.name);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  const start = performance.now();
  try {
    /* Sin CORS la respuesta es opaca, pero basta para saber si el servidor llega. */
    await fetch(check.url, {
      mode: check.headers ? 'cors' : 'no-cors',
      cache: 'no-store',
      headers: check.headers,
      signal: controller.signal
    });
    const ms = Math.round(performance.now() - start);
    showResult(cell, check.name, true, 'OK ' + ms + ' ms');
    return { key: check.key, ok: true, ms };
  } catch (error) {
    const timedOut = error.name === 'AbortError';
    showResult(cell, check.name, false, timedOut ? 'NO RESPONDE' : 'BLOQUEADO');
    return { key: check.key, ok: false };
  } finally {
    clearTimeout(timer);
  }
}

function hasWebGL2() {
  try {
    return !!document.createElement('canvas').getContext('webgl2');
  } catch (error) {
    return false;
  }
}

function verdictFor(results, webgl2) {
  const failed = (key) => results.some((result) => result.key === key && !result.ok);
  if (failed('accounts')) return 'Tu red no llega a jsDelivr: por eso la página puede quedarse en blanco.';
  if (failed('site')) return 'Tu red no llega a la página de Postal Sounds.';
  if (failed('map')) return 'Tu red no llega a Mapbox: el mapa no puede cargar.';
  if (!webgl2) return 'Tu navegador no tiene WebGL2: el mapa no puede dibujarse. Actualiza iOS o prueba otro dispositivo.';
  if (failed('data')) return 'Tu red no llega a Supabase: el mapa usa una copia de respaldo y puede ir más lento.';
  if (failed('photos')) return 'Tu red no llega a las fotos, pero el mapa debería funcionar.';
  return 'Todo responde bien desde tu red. Envíanos la captura igualmente.';
}

async function run() {
  const results = await Promise.all(CHECKS.map(runCheck));
  const webgl2 = hasWebGL2();
  const cell = addRow('WebGL2');
  showResult(cell, 'WebGL2', webgl2, webgl2 ? 'OK' : 'NO DISPONIBLE');

  const connection = navigator.connection && navigator.connection.effectiveType;
  const device = [
    new Date().toISOString(),
    navigator.userAgent,
    'Pantalla ' + screen.width + 'x' + screen.height + ' @' + window.devicePixelRatio,
    connection ? 'Conexión ' + connection : ''
  ].filter(Boolean);
  document.getElementById('device').textContent = device.join(' | ');
  const verdict = verdictFor(results, webgl2);
  document.getElementById('verdict').textContent = verdict;
  lines.push(verdict, ...device);
}

document.getElementById('copy').addEventListener('click', async (event) => {
  try {
    await navigator.clipboard.writeText(lines.join('\n'));
    event.target.textContent = 'Copiado';
  } catch (error) {
    event.target.textContent = 'No se pudo copiar: envía una captura';
  }
});

run();
</script>
</body>
</html>
