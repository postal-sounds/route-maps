function expandCompactSheetForAndroidTouch(event) {
  if (useFixedMobilePanel() ||
      !isAndroidTouchDevice() ||
      navigationState.sheetSnap === 'expanded') return false;

  const touchPoint = event.touches && event.touches[0];
  if (!touchPoint) return false;

  event.preventDefault();
  beginSheetDrag(touchPoint.clientY);
  return true;
}

function getPanelVisibleOverlap() {
  if (!map || navEls.panel.hidden) {
    return { top: 0, right: 0, bottom: 0, left: 0 };
  }

  const mapRect = map.getContainer().getBoundingClientRect();
  const panelRect = navEls.panel.getBoundingClientRect();

  if (isMobileLayout()) {
    const topPadding = 20;
    const panelOverlap = Math.max(0, Math.round(mapRect.bottom - panelRect.top)) + PANEL_PADDING_GAP;
    return {
      top: topPadding,
      right: 16,
      bottom: clampMobileBottomPadding(panelOverlap, topPadding),
      left: 16
    };
  }

  return {
    top: 24,
    right: 24,
    bottom: 24,
    left: Math.max(0, Math.round(panelRect.right - mapRect.left)) + PANEL_PADDING_GAP
  };
}

function clampMobileBottomPadding(bottomPadding, topPadding) {
  if (!map) return Math.max(0, bottomPadding);
  const mapHeight = map.getContainer().clientHeight;
  const maxBottomPadding = Math.max(
    0,
    mapHeight - Math.max(0, topPadding) - MOBILE_MAP_MIN_VISIBLE_HEIGHT_PX
  );
  return Math.max(0, Math.min(Math.round(bottomPadding), maxBottomPadding));
}

function getSheetOffsetForSnap(snap) {
  if (!isMobileLayout() || navEls.panel.hidden || useFixedMobilePanel()) return 0;

  const panelHeight = navEls.panel.getBoundingClientRect().height;
  if (!panelHeight) return 0;

  if (snap === 'peek') {
    return Math.max(0, panelHeight - MOBILE_SHEET_PEEK_HEIGHT_PX);
  }

  const viewportHeight = window.innerHeight || document.documentElement.clientHeight || panelHeight;
  const ratio = snap === 'expanded' ? MOBILE_SHEET_EXPANDED_RATIO : MOBILE_SHEET_COMPACT_RATIO;
  const minVisible = snap === 'expanded' ? 300 : 210;
  const visibleHeight = Math.min(panelHeight, Math.max(minVisible, Math.round(viewportHeight * ratio)));
  return Math.max(0, panelHeight - visibleHeight);
}

function updatePanelLiveHeightVar() {
  const panelHeight = navEls.panel.hidden ? 0 : Math.ceil(navEls.panel.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--postal-panel-live-height', panelHeight + 'px');
}

function updateMapPaddingForPanel() {
  if (!map) return;

  updatePanelLiveHeightVar();
  navEls.backButton.hidden = navEls.panel.hidden || !navigationState.route;

  if (navEls.panel.hidden) {
    map.setPadding({ top: 0, right: 0, bottom: 0, left: 0 });
    return;
  }

  map.setPadding(getPanelVisibleOverlap());
}

function setSheetOffset(offset) {
  const normalizedOffset = useFixedMobilePanel() ? 0 : Math.max(0, Math.round(offset || 0));
  navigationState.sheetOffset = normalizedOffset;
  navEls.panel.style.setProperty('--postal-sheet-offset', normalizedOffset + 'px');
  updateMapPaddingForPanel();
}

function setSheetSnap(snap) {
  navigationState.sheetSnap = snap;
  navEls.panel.dataset.sheetSnap = snap;
  setSheetOffset(getSheetOffsetForSnap(snap));
}

function resetPanelContent() {
  navEls.scroll.scrollTop = 0;
  navEls.metrics.hidden = true;
  navEls.modeGroup.hidden = true;
  navEls.instruction.textContent = '';
  navEls.goButton.hidden = true;
  navEls.goButton.disabled = false;
  navEls.goButton.textContent = '';
}

function focusMapOnSpot(coords) {
  if (!map || !isValidCoordinates(coords)) return;

  map.easeTo({
    center: coords,
    zoom: Math.max(map.getZoom(), isMobileLayout() ? 14 : 13),
    padding: getPanelVisibleOverlap(),
    duration: 450
  });
}

function scheduleMapAccommodation() {
  if (!map) return;

  const applyAccommodation = () => {
    map.resize();
    updateMapPaddingForPanel();

    if (navigationState.active) return;

    if (navigationState.route &&
        navigationState.route.geometry &&
        Array.isArray(navigationState.route.geometry.coordinates)) {
      fitRouteBounds(navigationState.route.geometry.coordinates);
      return;
    }

    if (navigationState.selectedSpot &&
        isValidCoordinates(navigationState.selectedSpot.coords)) {
      focusMapOnSpot(navigationState.selectedSpot.coords);
    }
  };

  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(() => requestAnimationFrame(applyAccommodation));
    return;
  }
  setTimeout(applyAccommodation, 0);
}

function getRouteFitPadding() {
  const panelPadding = getPanelVisibleOverlap();

  if (isMobileLayout()) {
    const topPadding = 60;
    return {
      top: topPadding,
      right: 32,
      bottom: clampMobileBottomPadding(Math.max(panelPadding.bottom, 120), topPadding),
      left: 32
    };
  }

  return {
    top: 60,
    right: 40,
    bottom: 60,
    left: Math.max(panelPadding.left, 360)
  };
}

function getTrackingPadding() {
  const panelPadding = getPanelVisibleOverlap();
  const mapHeight = map.getContainer().clientHeight;
  const topPadding = Math.round(mapHeight * NAVIGATION_CONFIG.lookAheadRatio);

  if (isMobileLayout()) {
    const mobileTopPadding = Math.max(topPadding, 80);
    return {
      top: mobileTopPadding,
      right: 20,
      bottom: clampMobileBottomPadding(Math.max(panelPadding.bottom, 100), mobileTopPadding),
      left: 20
    };
  }

  return {
    top: Math.max(topPadding, 80),
    right: 30,
    bottom: 48,
    left: Math.max(panelPadding.left, 340)
  };
}

function showNavPanel(preferExpanded) {
  navEls.panel.hidden = false;
  navEls.panel.dataset.dragging = 'false';
  updateStartRouteButtonVisibility();
  if (isMobileLayout()) {
    setSheetSnap(useFixedMobilePanel() ? 'expanded' : (preferExpanded ? 'expanded' : 'compact'));
    return;
  }

  navEls.panel.style.setProperty('--postal-sheet-offset', '0px');
  updateMapPaddingForPanel();
}

function hideNavPanel() {
  navEls.panel.hidden = true;
  navEls.panel.style.setProperty('--postal-sheet-offset', '0px');
  updateMapPaddingForPanel();
  updateStartRouteButtonVisibility();
}

function syncPanelLayout() {
  if (navEls.panel.hidden) return;

  if (isMobileLayout()) {
    setSheetSnap('expanded');
    return;
  }

  navEls.panel.style.setProperty('--postal-sheet-offset', '0px');
  updateMapPaddingForPanel();
}

function beginSheetDrag(clientY) {
  if (useFixedMobilePanel()) return;
  navigationState.isDraggingSheet = true;
  navigationState.dragStartY = clientY;
  navigationState.dragLastY = clientY;
  navigationState.dragStartOffset = navigationState.sheetOffset;
  navEls.panel.dataset.dragging = 'true';
  navEls.scroll.style.overflowY = 'hidden';
}

function moveSheetDrag(clientY) {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheet) return;

  navigationState.dragLastY = clientY;
  const expandedOffset = getSheetOffsetForSnap('expanded');
  const peekOffset = getSheetOffsetForSnap('peek');
  const nextOffset = navigationState.dragStartOffset + (clientY - navigationState.dragStartY);
  setSheetOffset(Math.min(peekOffset, Math.max(expandedOffset, nextOffset)));
}

function finishSheetDrag() {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheet) return;

  const dragDistance = navigationState.dragLastY - navigationState.dragStartY;
  navigationState.isDraggingSheet = false;
  navigationState.isDraggingSheetFromContent = false;
  navEls.panel.dataset.dragging = 'false';
  navEls.scroll.style.overflowY = '';

  const snaps = ['expanded', 'compact', 'peek'];
  const currentIndex = Math.max(0, snaps.indexOf(navigationState.sheetSnap));
  let nearestSnap = snaps[0];
  let nearestDistance = Infinity;
  snaps.forEach((snap) => {
    const distance = Math.abs(navigationState.sheetOffset - getSheetOffsetForSnap(snap));
    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearestSnap = snap;
    }
  });

  if (Math.abs(dragDistance) >= SHEET_SWIPE_THRESHOLD_PX &&
      nearestSnap === navigationState.sheetSnap) {
    const direction = dragDistance > 0 ? 1 : -1;
    const nextIndex = Math.max(0, Math.min(snaps.length - 1, currentIndex + direction));
    nearestSnap = snaps[nextIndex];
  }

  setSheetSnap(nearestSnap);
}

function handleSheetDragStart(event) {
  if (!isMobileLayout() || navEls.panel.hidden || useFixedMobilePanel()) return;
  if (event.pointerType === 'touch') return;
  beginSheetDrag(event.clientY);
  navEls.sheetHandle.setPointerCapture(event.pointerId);
}

function handleSheetDragMove(event) {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheet) return;
  moveSheetDrag(event.clientY);
}

function handleSheetDragEnd(event) {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheet) return;

  if (event && navEls.sheetHandle.hasPointerCapture(event.pointerId)) {
    navEls.sheetHandle.releasePointerCapture(event.pointerId);
  }
  finishSheetDrag();
}

function handleSheetHandleTouchStart(event) {
  if (!isMobileLayout() || navEls.panel.hidden || event.touches.length !== 1 || useFixedMobilePanel()) return;
  if (expandCompactSheetForAndroidTouch(event)) return;
  event.preventDefault();
  beginSheetDrag(event.touches[0].clientY);
}

function handleSheetHandleTouchMove(event) {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheet || event.touches.length !== 1) return;
  event.preventDefault();
  moveSheetDrag(event.touches[0].clientY);
}

function handleSheetHandleTouchEnd(event) {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheet) return;
  event.preventDefault();
  finishSheetDrag();
}

function isInteractiveSheetTouchTarget(target) {
  return target instanceof Element &&
    Boolean(target.closest('button, a, input, select, textarea'));
}

function handleSheetContentTouchStart(event) {
  if (!isMobileLayout() || navEls.panel.hidden || event.touches.length !== 1 || useFixedMobilePanel()) return;
  if (isInteractiveSheetTouchTarget(event.target)) return;
  if (expandCompactSheetForAndroidTouch(event)) return;

  navigationState.dragStartY = event.touches[0].clientY;
  navigationState.dragLastY = navigationState.dragStartY;
  navigationState.isDraggingSheetFromContent = false;

  if (navigationState.sheetSnap !== 'expanded') {
    event.preventDefault();
    navigationState.isDraggingSheetFromContent = true;
    beginSheetDrag(navigationState.dragStartY);
  }
}

function handleSheetContentTouchMove(event) {
  if (!isMobileLayout() || event.touches.length !== 1 || useFixedMobilePanel()) return;
  if (isInteractiveSheetTouchTarget(event.target)) return;

  const clientY = event.touches[0].clientY;
  const dragDistance = clientY - navigationState.dragStartY;
  const touchTarget = event.target instanceof Element ? event.target : null;
  const descriptionScroll = touchTarget ? touchTarget.closest('.postal-nav-card__description') : null;
  const descriptionCanScroll = descriptionScroll &&
    descriptionScroll.scrollHeight > descriptionScroll.clientHeight;
  const descriptionAtTop = !descriptionCanScroll || descriptionScroll.scrollTop <= 0;
  const canExpandSheet = dragDistance < -10 && navigationState.sheetSnap !== 'expanded';
  const canCollapseSheet = dragDistance > 10 &&
    navEls.scroll.scrollTop <= 0 &&
    descriptionAtTop;
  if (!navigationState.isDraggingSheetFromContent &&
      (canExpandSheet || canCollapseSheet)) {
    navigationState.isDraggingSheetFromContent = true;
    beginSheetDrag(navigationState.dragStartY);
  }

  if (!navigationState.isDraggingSheetFromContent) return;
  event.preventDefault();
  moveSheetDrag(clientY);
}

function handleSheetContentTouchEnd() {
  if (!useFixedMobilePanel() && navigationState.isDraggingSheetFromContent) finishSheetDrag();
}

function handleSheetContentPointerStart(event) {
  if (!isMobileLayout() || navEls.panel.hidden ||
      isInteractiveSheetTouchTarget(event.target) || useFixedMobilePanel()) return;
  if (event.pointerType === 'touch') return;
  if (navigationState.sheetSnap === 'expanded') return;

  event.preventDefault();
  navigationState.isDraggingSheetFromContent = true;
  beginSheetDrag(event.clientY);
  navEls.scroll.setPointerCapture(event.pointerId);
}

function handleSheetContentPointerMove(event) {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheetFromContent) return;
  event.preventDefault();
  moveSheetDrag(event.clientY);
}

function handleSheetContentPointerEnd(event) {
  if (useFixedMobilePanel() || !navigationState.isDraggingSheetFromContent) return;
  if (navEls.scroll.hasPointerCapture(event.pointerId)) {
    navEls.scroll.releasePointerCapture(event.pointerId);
  }
  finishSheetDrag();
}

function isValidCoordinates(coordinates) {
  return Array.isArray(coordinates) &&
    coordinates.length === 2 &&
    Number.isFinite(coordinates[0]) &&
    Number.isFinite(coordinates[1]) &&
    Math.abs(coordinates[0]) <= 180 &&
    Math.abs(coordinates[1]) <= 90;
}

/* Distancia aproximada entre dos puntos [lng, lat], en metros (fórmula de Haversine). */
function haversineMeters(a, b) {
  const R = 6371000;
  const toRad = (deg) => (deg * Math.PI) / 180;
  const dLat = toRad(b[1] - a[1]);
  const dLng = toRad(b[0] - a[0]);
  const lat1 = toRad(a[1]);
  const lat2 = toRad(b[1]);
  const sinDLat = Math.sin(dLat / 2);
  const sinDLng = Math.sin(dLng / 2);
  const h = sinDLat * sinDLat + Math.cos(lat1) * Math.cos(lat2) * sinDLng * sinDLng;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

/* Distancia aproximada de un punto a la polilínea: mínimo contra cada vértice. */
function distanceToRouteMeters(point, routeCoordinates) {
  let min = Infinity;
  for (let i = 0; i < routeCoordinates.length; i++) {
    const d = haversineMeters(point, routeCoordinates[i]);
    if (d < min) min = d;
  }
  return min;
}

function buildDirectionsUrl(origin, destination, profile, lang) {
  const coordinatePath = origin[0] + ',' + origin[1] + ';' + destination[0] + ',' + destination[1];
  const params = new URLSearchParams({
    steps: 'true',
    geometries: 'geojson',
    overview: 'full',
    language: lang === 'en' ? 'en' : 'es',
    access_token: MAPBOX_TOKEN
  });
  return 'https://api.mapbox.com/directions/v5/' + (ROUTE_PROFILES[profile] || ROUTE_PROFILES.walking) + '/' +
    coordinatePath + '?' + params.toString();
}

function isAbortError(error) {
  return error && (error.name === 'AbortError' || error.type === 'aborted');
}

async function requestRoute(origin, destination, profile, lang, signal) {
  const url = buildDirectionsUrl(origin, destination, profile, lang);
  let response;
  try {
    response = await fetch(url, { signal });
  } catch (err) {
    if (isAbortError(err) || (signal && signal.aborted)) throw err;
    throw { type: 'network' };
  }
  if (!response.ok) throw { type: 'http' };

  let data;
  try { data = await response.json(); } catch (err) { throw { type: 'unexpected' }; }

  if (!data || !Array.isArray(data.routes) || data.routes.length === 0) {
    throw { type: 'no-route' };
  }

  const route = data.routes[0];
  const coordinates = route && route.geometry && route.geometry.coordinates;
  const hasValidGeometry = route && route.geometry && route.geometry.type === 'LineString' &&
    Array.isArray(coordinates) && coordinates.length >= 2;

  if (!hasValidGeometry || !Number.isFinite(route.distance) || !Number.isFinite(route.duration)) {
    throw { type: 'unexpected' };
  }

  return route;
}

function cancelActiveRouteRequest() {
  const activeRequest = navigationState.activeRouteRequest;
  if (!activeRequest) return;
  clearTimeout(activeRequest.timer);
  activeRequest.controller.abort();
  navigationState.activeRouteRequest = null;
}

async function fetchNavigationRoute(origin, destination, profile, lang) {
  cancelActiveRouteRequest();

  const request = {
    controller: new AbortController(),
    timer: null,
    timedOut: false
  };
  request.timer = setTimeout(() => {
    request.timedOut = true;
    request.controller.abort();
  }, 15000);
  navigationState.activeRouteRequest = request;

  try {
    return await requestRoute(origin, destination, profile, lang, request.controller.signal);
  } catch (error) {
    if (request.controller.signal.aborted || isAbortError(error)) {
      throw { type: request.timedOut ? 'network' : 'aborted' };
    }
    throw error;
  } finally {
    clearTimeout(request.timer);
    if (navigationState.activeRouteRequest === request) {
      navigationState.activeRouteRequest = null;
    }
  }
}

function ensureNavigationLayers() {
  if (!map.getSource(ROUTE_SOURCE_ID)) {
    map.addSource(ROUTE_SOURCE_ID, {
      type: 'geojson',
      data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [] } }
    });
  }
  if (!map.getLayer(ROUTE_CASING_LAYER_ID)) {
    map.addLayer({
      id: ROUTE_CASING_LAYER_ID, type: 'line', source: ROUTE_SOURCE_ID,
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#232320', 'line-opacity': 0.35, 'line-width': 9 }
    });
  }
  if (!map.getLayer(ROUTE_LAYER_ID)) {
    map.addLayer({
      id: ROUTE_LAYER_ID, type: 'line', source: ROUTE_SOURCE_ID,
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': NAV_COLOR, 'line-opacity': 1, 'line-width': 5, 'line-emissive-strength': 1 }
    });
  }
}

function drawNavigationRoute(coordinates) {
  ensureNavigationLayers();
  map.getSource(ROUTE_SOURCE_ID).setData({
    type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates }
  });
}

function removeNavigationRoute() {
  if (!map) return;
  if (map.getLayer(ROUTE_LAYER_ID)) map.removeLayer(ROUTE_LAYER_ID);
  if (map.getLayer(ROUTE_CASING_LAYER_ID)) map.removeLayer(ROUTE_CASING_LAYER_ID);
  if (map.getSource(ROUTE_SOURCE_ID)) map.removeSource(ROUTE_SOURCE_ID);
}

function fitRouteBounds(coordinates) {
  const bounds = new mapboxgl.LngLatBounds();
  coordinates.forEach((c) => bounds.extend(c));
  map.fitBounds(bounds, {
    padding: getRouteFitPadding(),
    maxZoom: 17,
    duration: 600
  });
}

function formatDistance(meters) {
  if (meters < 1000) return Math.round(meters) + ' m';
  return (meters / 1000).toFixed(1) + ' km';
}
function formatDuration(seconds) {
  const totalMinutes = Math.ceil(seconds / 60);
  if (totalMinutes <= 60) return totalMinutes + ' min';

  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return hours + ' h' + (minutes ? ' ' + minutes + ' min' : '');
}

/* El contenido fijo del spot se pinta una sola vez al abrir la tarjeta. */
function renderDestinationCard(spot) {
  const imagePath = safeResourceUrl(spot.url);
  navEls.media.hidden = !imagePath;
  if (imagePath) {
    navEls.image.onload = () => { scheduleMapAccommodation(); };
    navEls.image.src = imagePath;
    navEls.image.alt = spot.name || '';
  } else {
    navEls.image.onload = null;
    navEls.image.removeAttribute('src');
    navEls.image.alt = '';
  }
  navEls.destination.textContent = spot.name || '';
  navEls.description.textContent = spot.description || '';
  navEls.description.hidden = !spot.description;
  navEls.tabs.hidden = false;
  setActiveNavTab('info');
  renderVideoTab(spot);
}

function renderVideoTab(spot) {
  navEls.videoWrap.textContent = '';
  /* Columna "videos" primero; si está vacía se usa "embed" para no perder los videos
     que ya están cargados en el sheet con el esquema anterior. */
  const iframe = createSheetEmbedElement(spot.videos || spot.embed, spot.name);
  if (iframe) {
    navEls.videoWrap.appendChild(iframe);
    navEls.videoWrap.hidden = false;
  } else {
    navEls.videoWrap.hidden = true;
  }
  navEls.extra.textContent = spot.textoExtra || '';
  navEls.extra.hidden = !spot.textoExtra;
}

function setActiveNavTab(tabKey) {
  navEls.tabButtons.forEach((button) => {
    const isActive = button.dataset.postalNavTab === tabKey;
    button.classList.toggle('is-active', isActive);
    button.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  navEls.tabInfo.hidden = tabKey !== 'info';
  navEls.tabVideo.hidden = tabKey !== 'video';
  scheduleMapAccommodation();
}

/* =========================================================================
 * BÚSQUEDA — autocompletado sobre los spots de la ruta ya cargada
 * ========================================================================= */

function normalizeSearchText(value) {
  return cleanText(value)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '');
}

function searchSpots(query) {
  const normalizedQuery = normalizeSearchText(query);
  if (!normalizedQuery) return [];
  return state.spots
    .filter((s) => normalizeSearchText(s.name).includes(normalizedQuery))
    .slice(0, 8);
}

function createSearchResultElement(spot, lang) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'postal-search-result';

  const imageUrl = safeResourceUrl(spot.url);
  if (imageUrl) {
    const img = document.createElement('img');
    img.className = 'postal-search-result-thumb';
    img.src = imageUrl;
    img.alt = '';
    img.loading = 'lazy';
    img.addEventListener('error', () => { img.remove(); }, { once: true });
    button.appendChild(img);
  } else {
    const placeholder = document.createElement('span');
    placeholder.className = 'postal-search-result-thumb';
    button.appendChild(placeholder);
  }

  const name = document.createElement('p');
  name.className = 'postal-search-result-name';
  name.textContent = (spot.index + 1) + '. ' + spot.name;
  button.appendChild(name);

  button.addEventListener('click', () => { selectSearchResult(spot, lang); });
  return button;
}

function renderSearchResults(query, lang) {
  searchEls.results.textContent = '';

  if (!query.trim()) {
    searchEls.results.hidden = true;
    return;
  }

  const matches = searchSpots(query);
  if (!matches.length) {
    const empty = document.createElement('p');
    empty.className = 'postal-search-empty';
    empty.textContent = text('noResults', lang);
    searchEls.results.appendChild(empty);
    searchEls.results.hidden = false;
    return;
  }

  matches.forEach((spot) => {
    searchEls.results.appendChild(createSearchResultElement(spot, lang));
  });
  searchEls.results.hidden = false;
}

function setSearchClearVisible() {
  searchEls.clear.hidden = !searchEls.input.value;
}

function closeSearchResults() {
  searchEls.results.hidden = true;
  searchEls.results.textContent = '';
}

/* Selecciona un resultado: lleva a esa ubicación y abre el sheet, igual que al tocar el marcador. */
function selectSearchResult(spot, lang) {
  searchEls.input.value = '';
  setSearchClearVisible();
  closeSearchResults();
  searchEls.input.blur();

  if (navigationState.active || navigationState.route) {
    stopNavigation();
  }

  const selectedSpot = {
    index: spot.index,
    name: spot.name,
    coords: [spot.lng, spot.lat],
    description: spot.description,
    url: spot.url,
    embed: spot.embed,
    videos: spot.videos,
    textoExtra: spot.textoExtra
  };

  state.activeSpot = selectedSpot;
  renderSpotPanel(selectedSpot, lang);
}

function renderSpotPanel(spot, lang) {
  state.activeSpot = spot;
  navigationState.selectedSpot = spot;
  renderDestinationCard(spot);
  resetPanelContent();
  navEls.goButton.textContent = navText('wantToGo', lang);
  navEls.goButton.hidden = false;
  navEls.stopButton.setAttribute('aria-label', navText('close', lang));
  showNavPanel(false);
  scheduleMapAccommodation();
  showSelectedSpotMarker(spot);
}

/* Pin sobre el spot seleccionado; vive aparte de los marcadores numerados. */
let selectedSpotMarker = null;

function showSelectedSpotMarker(spot) {
  if (!map || !isValidCoordinates(spot.coords)) return;
  removeSelectedSpotMarker();

  const el = document.createElement('div');
  el.className = 'postal-selected-marker';
  el.innerHTML =
    '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">' +
    '<path d="M12 21s-7-7.2-7-12.2a7 7 0 0 1 14 0C19 13.8 12 21 12 21z" fill="' + ACCENT_COLOR + '" stroke="#232320" stroke-width="1.2"/>' +
    '<circle cx="12" cy="8.8" r="2.6" fill="#232320"/>' +
    '</svg>';

  selectedSpotMarker = new mapboxgl.Marker({ element: el, anchor: 'bottom' })
    .setLngLat(spot.coords)
    .addTo(map);
}

function removeSelectedSpotMarker() {
  if (!selectedSpotMarker) return;
  selectedSpotMarker.remove();
  selectedSpotMarker = null;
}

/* Al entrar en modo ruta se oculta el detalle del spot (como en Maps) y solo queda el nombre. */
function enterRoutePreviewMode() {
  navEls.media.hidden = true;
  navEls.description.hidden = true;
  navEls.tabs.hidden = true;
  navEls.tabInfo.hidden = true;
  navEls.tabVideo.hidden = true;
}

function updateRouteModeButtons(lang) {
  navEls.modeButtons.forEach((button) => {
    const mode = button.dataset.postalRouteMode;
    const route = navigationState.routesByMode[mode];
    const failed = navigationState.routeModeErrors[mode];
    const label = button.querySelector('.postal-route-mode__button-label');
    const time = button.querySelector('.postal-route-mode__button-time');
    if (label) label.textContent = navText(mode === 'driving' ? 'modeDriving' : 'modeWalking', lang);
    if (time) time.textContent = route ? formatDuration(route.duration) : (failed ? '' : '…');
    button.hidden = !!failed;
    button.disabled = !route || navigationState.isRecalculating;
    button.classList.toggle('is-active', mode === navigationState.routeMode);
  });
}

function formatArrivalTime(durationSeconds, lang) {
  const arrival = new Date(Date.now() + durationSeconds * 1000);
  const locale = lang === 'en' ? 'en-US' : 'es-CO';
  return arrival.toLocaleTimeString(locale, { hour: 'numeric', minute: '2-digit' });
}

function renderRouteSummary(route, lang) {
  navEls.duration.textContent = formatDuration(route.duration);
  navEls.arrival.textContent = navText('arriveAt', lang) + ' ' + formatArrivalTime(route.duration, lang);
  navEls.distance.textContent = formatDistance(route.distance);
  navEls.metrics.hidden = false;
}

function renderNextInstruction(route) {
  const steps = route && route.legs && route.legs[0] && route.legs[0].steps;
  const instruction = steps && steps.length && steps[0].maneuver && steps[0].maneuver.instruction;
  navEls.instruction.textContent = instruction || '';
}

function showNavigationError(message) {
  navEls.error.textContent = message;
  navEls.error.hidden = false;
  window.clearTimeout(showNavigationError._t);
  showNavigationError._t = window.setTimeout(() => { navEls.error.hidden = true; }, 6000);
}

/* Rumbo entre dos puntos en grados; se usa cuando coords.heading no está disponible. */
function computeBearing(from, to) {
  const toRad = (d) => (d * Math.PI) / 180;
  const toDeg = (r) => (r * 180) / Math.PI;
  const lat1 = toRad(from[1]);
  const lat2 = toRad(to[1]);
  const dLng = toRad(to[0] - from[0]);
  const y = Math.sin(dLng) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* La cámara rota con el rumbo y deja más espacio visible por delante del usuario. */
function updateNavigationCamera(coords, heading) {
  const hasHeading = typeof heading === 'number' && Number.isFinite(heading);
  if (hasHeading) navigationState.lastBearing = heading;

  map.easeTo({
    center: coords,
    zoom: NAVIGATION_CONFIG.trackingZoom,
    pitch: NAVIGATION_CONFIG.trackingPitch,
    bearing: navigationState.lastBearing,
    padding: getTrackingPadding(),
    duration: 700
  });
}

async function recalculateRoute(origin, lang, options) {
  const opts = options || {};
  if (navigationState.isRecalculating) return;
  const now = Date.now();
  if (!opts.force && now - navigationState.lastRecalculationAt < NAVIGATION_CONFIG.recalculationCooldownMs) return;

  navigationState.isRecalculating = true;
  navigationState.lastRecalculationAt = now;
  updateRouteModeButtons(lang);

  try {
    const route = await fetchNavigationRoute(
      origin,
      navigationState.destination.coords,
      navigationState.routeMode,
      lang
    );
    navigationState.route = route;
    navigationState.routesByMode[navigationState.routeMode] = route;
    navigationState.origin = origin;
    drawNavigationRoute(route.geometry.coordinates);
    renderRouteSummary(route, lang);
    renderNextInstruction(route);
  } catch (err) {
    if (!isAbortError(err)) console.error('Postal Sounds: recalculo de ruta fallido', err);
  } finally {
    navigationState.isRecalculating = false;
    updateRouteModeButtons(lang);
  }
}

function setRouteMode(mode, lang) {
  if (!ROUTE_PROFILES[mode]) return;
  if (mode === navigationState.routeMode) return;
  if (navigationState.isRecalculating || !navigationState.origin || !navigationState.destination) return;

  const cachedRoute = navigationState.routesByMode[mode];
  if (cachedRoute) {
    navigationState.routeMode = mode;
    navigationState.route = cachedRoute;
    drawNavigationRoute(cachedRoute.geometry.coordinates);
    renderRouteSummary(cachedRoute, lang);
    updateRouteModeButtons(lang);
    if (!navigationState.active) {
      focusRouteCamera(cachedRoute.geometry.coordinates, navigationState.origin, navigationState.destination.coords);
    }
    scheduleMapAccommodation();
    return;
  }

  navigationState.routeMode = mode;
  recalculateRoute(navigationState.origin, lang, { force: true });
}

function checkRouteDeviation(coords, lang) {
  if (!navigationState.route) return;
  const distance = distanceToRouteMeters(coords, navigationState.route.geometry.coordinates);
  if (distance > NAVIGATION_CONFIG.deviationThresholdMeters) {
    recalculateRoute(coords, lang);
  }
}

function checkArrival(coords, lang) {
  if (!navigationState.destination || navigationState.arrived) return;
  const distance = haversineMeters(coords, navigationState.destination.coords);
  if (distance <= NAVIGATION_CONFIG.arrivalThresholdMeters) {
    navigationState.arrived = true;
    const arrivedSpot = navigationState.destination;
    stopLocationTracking();
    handleArrivalAtStop(arrivedSpot, lang);
  }
}

function stopLocationTracking() {
  if (navigationState.watchId !== null) {
    if (window.top && window.top !== window) {
      postGeoMessage({ type: 'watchStop', watchKey: navigationState.watchId });
    }
    navigationState.watchId = null;
  }
  if (navigationState.directWatchId !== null) {
    const provider = getGeolocationProvider();
    if (provider && typeof provider.clearWatch === 'function') provider.clearWatch(navigationState.directWatchId);
    navigationState.directWatchId = null;
  }
}

function handleLocationUpdate(position, lang) {
  const coords = [position.coords.longitude, position.coords.latitude];
  if (!isValidCoordinates(coords)) return;

  const previousCoords = navigationState.lastPosition;
  navigationState.lastPosition = coords;
  navigationState.lastPositionAt = Date.now();

  const rawHeading = position.coords.heading;
  let heading = (typeof rawHeading === 'number' && Number.isFinite(rawHeading)) ? rawHeading : null;

  if (heading === null && previousCoords) {
    const movedMeters = haversineMeters(previousCoords, coords);
    if (movedMeters >= NAVIGATION_CONFIG.minMovementForBearingMeters) {
      heading = computeBearing(previousCoords, coords);
    }
  }

  updateNavigationCamera(coords, heading);
  checkRouteDeviation(coords, lang);
  checkArrival(coords, lang);
}

function startLocationTracking(lang) {
  stopLocationTracking();
  currentTrackingLang = lang;

  /* Se piden ambas vías a la vez (relay al padre + watch directo del navegador), igual que
     getCurrentUserPosition(): si el padre (Framer) no implementa el protocolo de relay, el
     watch directo sigue funcionando cuando el permiso de geolocalización sí está delegado
     al iframe. stopLocationTracking() ya limpia las dos, así que aquí no hace falta elegir. */
  if (window.top && window.top !== window) {
    const watchKey = 'watch-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    navigationState.watchId = watchKey;
    postGeoMessage({ type: 'watchStart', watchKey });
  }

  const provider = getGeolocationProvider();
  if (provider && typeof provider.watchPosition === 'function') {
    navigationState.directWatchId = provider.watchPosition(
      (position) => handleLocationUpdate(position, currentTrackingLang),
      (error) => console.error('Postal Sounds: watchPosition falló', error),
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
    );
  }
}

function stopNavigation() {
  cancelActiveRouteRequest();
  stopLocationTracking();
  removeNavigationRoute();
  removeSelectedSpotMarker();
  hideNavPanel();
  navEls.error.hidden = true;
  resetPanelContent();
  state.activeSpot = null;
  navigationState.active = false;
  navigationState.destination = null;
  navigationState.selectedSpot = null;
  navigationState.origin = null;
  navigationState.route = null;
  navigationState.routesByMode = {};
  navigationState.routeModeErrors = {};
  navigationState.routeMode = NAVIGATION_CONFIG.defaultProfile;
  navigationState.lastPosition = null;
  navigationState.lastPositionAt = 0;
  navigationState.arrived = false;
  navigationState.isRecalculating = false;
  navigationState.lastRecalculationAt = 0;
  navigationState.lastBearing = 0;
  map.easeTo({
    pitch: 0, bearing: 0,
    padding: { top: 0, bottom: 0, left: 0, right: 0 },
    duration: 500
  });
}

function closeSpotPanel() {
  cancelActiveRouteRequest();
  removeNavigationRoute();
  removeSelectedSpotMarker();
  state.activeSpot = null;
  navigationState.selectedSpot = null;
  navigationState.destination = null;
  navigationState.origin = null;
  navigationState.route = null;
  navigationState.routesByMode = {};
  navigationState.routeModeErrors = {};
  navigationState.routeMode = NAVIGATION_CONFIG.defaultProfile;
  hideNavPanel();
  navEls.error.hidden = true;
  resetPanelContent();
  map.easeTo({
    pitch: 0, bearing: 0,
    padding: { top: 0, bottom: 0, left: 0, right: 0 },
    duration: 500
  });
}

function activateStopButton() {
  if (navigationState.active) {
    stopNavigation();
    return;
  }
  closeSpotPanel();
}

function handleStopButtonTouchEnd(event) {
  event.preventDefault();
  event.stopPropagation();
  activateStopButton();
}

/* Etapa 1: "Quiero ir" calcula y dibuja la ruta en preview, sin iniciar el seguimiento en vivo. */
async function handleWantToGoClick(spot, button, lang) {
  if (!isValidCoordinates(spot.coords)) {
    showNavigationError(navText('errInvalidDestination', lang));
    return;
  }

  /* El encabezado del panel puede seguir mostrando otra parada (p. ej. al aceptar la
     sugerencia de "siguiente parada" desde la que se acaba de visitar); se actualiza aquí
     para que siempre refleje hacia dónde se está calculando la ruta. */
  navEls.destination.textContent = spot.name || '';

  button.disabled = true;
  button.textContent = navText('calculating', lang);

  let origin;
  try {
    origin = await getCurrentUserPosition();
  } catch (error) {
    button.disabled = false;
    button.textContent = navText('wantToGo', lang);
    showNavigationError(describeGeolocationError(error, lang));
    return;
  }

  const originCoords = [origin.coords.longitude, origin.coords.latitude];
  if (!isValidCoordinates(originCoords)) {
    button.disabled = false;
    button.textContent = navText('wantToGo', lang);
    showNavigationError(navText('errUnavailable', lang));
    return;
  }
  navigationState.lastPosition = originCoords;
  navigationState.lastPositionAt = Date.now();

  let route;
  let resolvedProfile = NAVIGATION_CONFIG.defaultProfile;
  try {
    route = await fetchNavigationRoute(originCoords, spot.coords, resolvedProfile, lang);
  } catch (error) {
    if (error && error.type === 'aborted') {
      button.disabled = false;
      button.textContent = navText('wantToGo', lang);
      return;
    }

    if (error && error.type === 'no-route') {
      const fallbackProfile = Object.keys(ROUTE_PROFILES).find((m) => m !== resolvedProfile);
      try {
        if (!fallbackProfile) throw { type: 'no-route' };
        route = await fetchNavigationRoute(originCoords, spot.coords, fallbackProfile, lang);
        resolvedProfile = fallbackProfile;
      } catch (fallbackError) {
        button.disabled = false;
        button.textContent = navText('wantToGo', lang);
        if (fallbackError && fallbackError.type === 'aborted') return;
        showNavigationError(navText('errNoRoute', lang));
        return;
      }
    } else {
      button.disabled = false;
      button.textContent = navText('wantToGo', lang);
      const key = error && error.type === 'network' ? 'errNetwork' : 'errRoute';
      showNavigationError(navText(key, lang));
      return;
    }
  }

  navigationState.destination = spot;
  navigationState.origin = originCoords;
  navigationState.routesByMode = { [resolvedProfile]: route };
  navigationState.routeModeErrors = {};
  navigationState.route = route;
  navigationState.routeMode = resolvedProfile;
  navigationState.arrived = false;
  navigationState.lastRecalculationAt = Date.now();

  drawNavigationRoute(route.geometry.coordinates);
  enterRoutePreviewMode();
  renderRouteSummary(route, lang);
  navEls.modeGroup.hidden = false;
  updateRouteModeButtons(lang);

  button.disabled = false;
  button.textContent = navText('go', lang);
  showNavPanel(true);
  focusRouteCamera(route.geometry.coordinates, originCoords, spot.coords);
  scheduleMapAccommodation();

  const secondaryMode = Object.keys(ROUTE_PROFILES).find((m) => m !== resolvedProfile);
  if (secondaryMode) {
    fetchNavigationRoute(originCoords, spot.coords, secondaryMode, lang)
      .then((secondaryRoute) => {
        if (navigationState.destination !== spot) return;
        navigationState.routesByMode[secondaryMode] = secondaryRoute;
        updateRouteModeButtons(lang);
      })
      .catch(() => {
        if (navigationState.destination !== spot) return;
        navigationState.routeModeErrors[secondaryMode] = true;
        updateRouteModeButtons(lang);
      });
  }
}

/* La cámara de la preview se acerca a la ruta y se orienta en el rumbo inicial que da Mapbox. */
function focusRouteCamera(coordinates, originCoords, destinationCoords) {
  if (!map || !Array.isArray(coordinates) || !coordinates.length) return;

  const initialBearing = coordinates.length > 1
    ? computeBearing(coordinates[0], coordinates[1])
    : computeBearing(originCoords, destinationCoords);

  const bounds = new mapboxgl.LngLatBounds();
  coordinates.forEach((c) => bounds.extend(c));
  map.fitBounds(bounds, {
    padding: getRouteFitPadding(),
    maxZoom: 17,
    bearing: initialBearing,
    pitch: NAVIGATION_CONFIG.trackingPitch,
    duration: 700
  });
}

/* Etapa 2: "Ir" confirma el viaje ya previsualizado e inicia el seguimiento en vivo. */
function handleStartTrackingClick(lang) {
  if (!navigationState.destination || !navigationState.route) return;

  stopLocationTracking();
  navigationState.active = true;
  navEls.goButton.hidden = true;
  navEls.stopButton.setAttribute('aria-label', navText('stop', lang));
  navEls.modeGroup.hidden = true;
  renderNextInstruction(navigationState.route);
  showNavPanel(true);
  map.resize();
  updateMapPaddingForPanel();

  const coordinates = navigationState.route.geometry.coordinates;
  const originCoords = navigationState.origin || (coordinates.length ? coordinates[0] : null);
  const initialBearing = coordinates.length > 1
    ? computeBearing(coordinates[0], coordinates[1])
    : navigationState.lastBearing;
  if (isValidCoordinates(originCoords)) {
    updateNavigationCamera(originCoords, initialBearing);
  }

  startLocationTracking(lang);
}

/* Botón "atrás": del seguimiento activo vuelve a la preview de ruta (sin recalcular nada). */
function backToPreview(lang) {
  if (!navigationState.route || !navigationState.destination) return;

  stopLocationTracking();
  navigationState.active = false;
  navigationState.arrived = false;

  navEls.goButton.hidden = false;
  navEls.goButton.disabled = false;
  navEls.goButton.textContent = navText('go', lang);
  navEls.modeGroup.hidden = false;
  navEls.instruction.textContent = '';
  navEls.stopButton.setAttribute('aria-label', navText('close', lang));
  updateRouteModeButtons(lang);
  renderRouteSummary(navigationState.route, lang);
  showNavPanel(true);

  map.resize();
  updateMapPaddingForPanel();
  focusRouteCamera(navigationState.route.geometry.coordinates, navigationState.origin, navigationState.destination.coords);
}

/* Botón "atrás": de la preview de ruta vuelve al detalle del spot (sin cerrar el panel). */
function backToSpotDetail(lang) {
  const spot = navigationState.destination || navigationState.selectedSpot;
  if (!spot) return;

  cancelActiveRouteRequest();
  removeNavigationRoute();
  navigationState.destination = null;
  navigationState.origin = null;
  navigationState.route = null;
  navigationState.routesByMode = {};
  navigationState.routeModeErrors = {};
  navigationState.routeMode = NAVIGATION_CONFIG.defaultProfile;
  navigationState.selectedSpot = spot;
  state.activeSpot = spot;

  renderDestinationCard(spot);
  resetPanelContent();
  navEls.goButton.textContent = navText('wantToGo', lang);
  navEls.goButton.hidden = false;
  navEls.stopButton.setAttribute('aria-label', navText('close', lang));
  showNavPanel(false);

  map.resize();
  updateMapPaddingForPanel();
  if (isValidCoordinates(spot.coords)) {
    map.easeTo({
      center: spot.coords,
      zoom: Math.max(map.getZoom(), isMobileLayout() ? 14 : 13),
      pitch: 0, bearing: 0,
      padding: getPanelVisibleOverlap(),
      duration: 500
    });
  }
}

function handleBackButtonClick(lang) {
  if (navigationState.active) {
    backToPreview(lang);
    return;
  }
  if (navigationState.route) {
    backToSpotDetail(lang);
  }
}

/* ====================== fin bloque de navegación ====================== */

/* =========================================================================
 * RUTA GUIADA — progreso secuencial no estricto: sugiere la siguiente parada
 * al llegar a una, pero el usuario puede tocar cualquier otro pin en cualquier momento.
 * ========================================================================= */

const routeProgress = { visited: new Set() };
let spotMarkerEls = [];
let routeLegFeatures = [];

function updateMarkerVisitedState(index) {
  const el = spotMarkerEls[index];
  if (el) el.classList.add('is-visited');
}

function updateStartRouteButtonVisibility() {
  const btn = document.getElementById('postal-start-route-btn');
  if (!btn) return;
  btn.hidden = !(navEls.panel.hidden && routeProgress.visited.size === 0 && state.spots.length > 0);
}

function updateRouteProgressBadge() {
  const badge = document.getElementById('postal-route-progress');
  const textEl = document.getElementById('postal-route-progress-text');
  if (!badge || !textEl) return;
  if (!routeProgress.visited.size) { badge.hidden = true; return; }
  textEl.textContent = routeProgress.visited.size + ' / ' + state.spots.length;
  badge.hidden = false;
}

function buildStraightLegFeatures(spots) {
  const features = [];
  for (let i = 0; i < spots.length - 1; i++) {
    features.push({
      type: 'Feature',
      properties: { legIndex: i },
      geometry: { type: 'LineString', coordinates: [[spots[i].lng, spots[i].lat], [spots[i + 1].lng, spots[i + 1].lat]] }
    });
  }
  return features;
}

function splitLegFeaturesByProgress() {
  const done = [];
  const todo = [];
  routeLegFeatures.forEach((feature) => {
    const isDone = routeProgress.visited.has(feature.properties.legIndex + 1);
    (isDone ? done : todo).push(feature);
  });
  return { done, todo };
}

function updateStaticRouteLayers() {
  if (!map || !map.getSource(STATIC_ROUTE_DONE_SOURCE_ID) || !map.getSource(STATIC_ROUTE_TODO_SOURCE_ID)) return;
  const { done, todo } = splitLegFeaturesByProgress();
  map.getSource(STATIC_ROUTE_DONE_SOURCE_ID).setData({ type: 'FeatureCollection', features: done });
  map.getSource(STATIC_ROUTE_TODO_SOURCE_ID).setData({ type: 'FeatureCollection', features: todo });
}

/* Botón "Empezar ruta": pide ubicación y lanza "Quiero ir" hacia la primera parada. */
function toNavigableSpot(spot) {
  return {
    index: spot.index,
    name: spot.name,
    coords: [spot.lng, spot.lat],
    description: spot.description,
    url: spot.url,
    embed: spot.embed,
    videos: spot.videos,
    textoExtra: spot.textoExtra
  };
}

function startGuidedRoute(lang) {
  if (!state.spots.length) return;
  const firstSpot = toNavigableSpot(state.spots[0]);
  state.activeSpot = firstSpot;
  renderSpotPanel(firstSpot, lang);
  handleWantToGoClick(firstSpot, navEls.goButton, lang);
}

/* Al llegar a una parada: se marca visitada, se actualiza el trazado y se sugiere
   (sin forzar) la siguiente parada de la secuencia. */
function handleArrivalAtStop(spot, lang) {
  if (typeof spot.index === 'number') {
    routeProgress.visited.add(spot.index);
    updateMarkerVisitedState(spot.index);
    updateStaticRouteLayers();
  }
  updateRouteProgressBadge();

  cancelActiveRouteRequest();
  removeNavigationRoute();
  navigationState.active = false;
  navigationState.destination = null;
  navigationState.origin = null;
  navigationState.route = null;
  navigationState.routesByMode = {};
  navigationState.routeModeErrors = {};
  navigationState.routeMode = NAVIGATION_CONFIG.defaultProfile;
  navigationState.selectedSpot = spot;

  renderDestinationCard(spot);
  resetPanelContent();
  navEls.stopButton.setAttribute('aria-label', navText('close', lang));
  showNavPanel(false);
  showSelectedSpotMarker(spot);

  const nextSpotRaw = typeof spot.index === 'number' ? state.spots[spot.index + 1] : null;
  if (nextSpotRaw) {
    const nextSpot = toNavigableSpot(nextSpotRaw);
    state.activeSpot = nextSpot;
    navEls.goButton.textContent = navText('nextStop', lang) + ' ' + (nextSpot.index + 1) + ': ' + nextSpot.name;
    navEls.goButton.hidden = false;
  } else {
    state.activeSpot = spot;
    navEls.instruction.textContent = navText('routeComplete', lang);
  }

  map.easeTo({ pitch: 0, bearing: 0, padding: getPanelVisibleOverlap(), duration: 500 });
  scheduleMapAccommodation();
}

/* ====================== fin bloque de ruta guiada ====================== */

/* =========================================================================
 * PANTALLA COMPLETA — usa la Fullscreen API del navegador; si algún iframe
 * padre (p. ej. el embed de Framer) no delega el permiso, el botón se oculta.
 * ========================================================================= */

function isFullscreen() {
  return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
}

function updateFullscreenButton(lang) {
  const button = document.getElementById('postal-fullscreen-btn');
  const icon = button.querySelector('.material-symbols-outlined');
  const active = isFullscreen();
  icon.textContent = active ? 'fullscreen_exit' : 'fullscreen';
  const label = active ? text('exitFullscreen', lang) : text('fullscreen', lang);
  button.title = label;
  button.setAttribute('aria-label', label);
}

function toggleFullscreen() {
  if (isFullscreen()) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
    return;
  }
  const el = document.documentElement;
  const request = el.requestFullscreen || el.webkitRequestFullscreen;
  if (request) request.call(el);
}

function setupFullscreenButton(lang) {
  const button = document.getElementById('postal-fullscreen-btn');
  const supported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!supported) return;

  button.hidden = false;
  updateFullscreenButton(lang);
  button.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', () => updateFullscreenButton(lang));
  document.addEventListener('webkitfullscreenchange', () => updateFullscreenButton(lang));
}

const state = { activeSpot: null, spots: [] };

async function init() {
  const lang = detectLanguage();
  document.documentElement.lang = lang;

  const locateButton = document.getElementById('locate-btn');
  locateButton.title = text('locate', lang);
  locateButton.setAttribute('aria-label', text('locate', lang));

  const startRouteButton = document.getElementById('postal-start-route-btn');
  startRouteButton.querySelector('.postal-start-route-btn__label').textContent = navText('startRoute', lang);
  startRouteButton.addEventListener('click', () => { startGuidedRoute(lang); });

  setupFullscreenButton(lang);

  searchEls.input.setAttribute('placeholder', text('searchPlaceholder', lang));
  searchEls.input.addEventListener('input', () => {
    setSearchClearVisible();
    renderSearchResults(searchEls.input.value, lang);
  });
  searchEls.input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      searchEls.input.value = '';
      setSearchClearVisible();
      closeSearchResults();
      searchEls.input.blur();
      return;
    }
    if (event.key === 'Enter') {
      const firstResult = searchEls.results.querySelector('.postal-search-result');
      if (firstResult) firstResult.click();
    }
  });
  searchEls.clear.addEventListener('click', () => {
    searchEls.input.value = '';
    setSearchClearVisible();
    closeSearchResults();
    searchEls.input.focus();
  });
  document.addEventListener('click', (event) => {
    if (searchEls.results.hidden) return;
    if (searchEls.shell.contains(event.target)) return;
    closeSearchResults();
  });

  navEls.stopButton.setAttribute('aria-label', navText('close', lang));
  navEls.stopButton.addEventListener('click', activateStopButton);
  navEls.stopButton.addEventListener('touchend', handleStopButtonTouchEnd, { passive: false });
  navEls.goButton.addEventListener('click', () => {
    const spot = state.activeSpot || navigationState.selectedSpot;
    if (!spot) return;
    if (navigationState.route && !navigationState.active) {
      handleStartTrackingClick(lang);
      return;
    }
    handleWantToGoClick(spot, navEls.goButton, lang);
  });
  navEls.backButton.addEventListener('click', () => { handleBackButtonClick(lang); });
  navEls.modeButtons.forEach((button) => {
    button.addEventListener('click', () => { setRouteMode(button.dataset.postalRouteMode, lang); });
  });
  navEls.tabButtons.forEach((button) => {
    const tabKey = button.dataset.postalNavTab;
    button.textContent = text(tabKey === 'video' ? 'tabVideo' : 'tabInfo', lang);
    button.addEventListener('click', () => { setActiveNavTab(tabKey); });
  });
  if ('PointerEvent' in window) {
    navEls.sheetHandle.addEventListener('pointerdown', handleSheetDragStart);
    navEls.sheetHandle.addEventListener('pointermove', handleSheetDragMove);
    navEls.sheetHandle.addEventListener('pointerup', handleSheetDragEnd);
    navEls.sheetHandle.addEventListener('pointercancel', handleSheetDragEnd);
    navEls.scroll.addEventListener('pointerdown', handleSheetContentPointerStart);
    navEls.scroll.addEventListener('pointermove', handleSheetContentPointerMove);
    navEls.scroll.addEventListener('pointerup', handleSheetContentPointerEnd);
    navEls.scroll.addEventListener('pointercancel', handleSheetContentPointerEnd);
  }
  navEls.sheetHandle.addEventListener('touchstart', handleSheetHandleTouchStart, { passive: false });
  navEls.sheetHandle.addEventListener('touchmove', handleSheetHandleTouchMove, { passive: false });
  navEls.sheetHandle.addEventListener('touchend', handleSheetHandleTouchEnd, { passive: false });
  navEls.sheetHandle.addEventListener('touchcancel', handleSheetHandleTouchEnd, { passive: false });
  navEls.scroll.addEventListener('touchstart', handleSheetContentTouchStart, { passive: false });
  navEls.scroll.addEventListener('touchmove', handleSheetContentTouchMove, { passive: false });
  navEls.scroll.addEventListener('touchend', handleSheetContentTouchEnd, { passive: true });
  navEls.scroll.addEventListener('touchcancel', handleSheetContentTouchEnd, { passive: true });
  resetPanelContent();

  showStatus(text('loading', lang));
  const params = new URLSearchParams(window.location.search);
  const routeParam = params.get('route');
  let rows;
  try {
    rows = await loadRouteRows(routeParam);
  } catch (err) {
    showStatus(text('loadingError', lang), text('loadingErrorDetail', lang));
    return;
  }
  if (!rows.length) {
    showStatus(text('noData', lang), text('emptySheet', lang));
    return;
  }
  const routesMap = {};
  for (const row of rows) {
    const rName = (row.route || '').trim();
    if (!rName) continue;
    const lat = parseCoord(row.latitude);
    const lng = parseCoord(row.longitude);
    if (isNaN(lat) || isNaN(lng)) continue;
    if (!routesMap[rName]) routesMap[rName] = { description: '', spots: [] };
    const desc = (row['Descripcion de ruta'] || '').trim();
    if (desc && !routesMap[rName].description) routesMap[rName].description = desc;
    routesMap[rName].spots.push({
      lat, lng,
      id: row.ID || '',
      name: localizedField(row.name || text('unnamed', lang), row.name_en, lang),
      description: localizedField(row.description || '', row.description_en, lang),
      url: row.url || '',
      embed: row.embed || '',
      videos: row.videos || '',
      textoExtra: row.texto_extra || ''
    });
  }
  for (const key of Object.keys(routesMap)) {
    routesMap[key].spots.sort((a, b) => {
      const aNum = a.id.includes('.') ? parseFloat(a.id.split('.')[1]) : 0;
      const bNum = b.id.includes('.') ? parseFloat(b.id.split('.')[1]) : 0;
      return aNum - bNum;
    });
  }
  const allRouteNames = Object.keys(routesMap);
  let resolvedRoute = null;
  if (routeParam) {
    const lookup = routeParam.toLowerCase().trim();
    for (const name of allRouteNames) {
      if (name.toLowerCase().trim() === lookup) { resolvedRoute = name; break; }
    }
    if (!resolvedRoute) {
      showStatus(
        text('routeNotFound', lang),
        '"' + routeParam + '" ' + text('routeNotFoundDetail', lang) + ' ' + allRouteNames.join(', ')
      );
      return;
    }
  } else {
    resolvedRoute = allRouteNames[0];
  }
  if (!resolvedRoute || !routesMap[resolvedRoute].spots.length) {
    showStatus(text('noRoutes', lang), text('noValidRoutes', lang));
    return;
  }
  hideStatus();
  const spots = routesMap[resolvedRoute].spots.map((spot, index) => ({ ...spot, index }));
  state.spots = spots;
  updateStartRouteButtonVisibility();
  updateRouteProgressBadge();

  mapboxgl.accessToken = MAPBOX_TOKEN;
  map = new mapboxgl.Map({
    container: 'map',
    style: MAPBOX_STYLE,
    center: [spots[0].lng, spots[0].lat],
    zoom: 14,
    attributionControl: false
  });
  map.addControl(new mapboxgl.AttributionControl({ compact: true }));

  map.on('load', function () {
    const bounds = new mapboxgl.LngLatBounds();
    spots.forEach(s => bounds.extend([s.lng, s.lat]));
    map.fitBounds(bounds, { padding: 60, maxZoom: 15, duration: 0 });

    spots.forEach((spot) => {
      const el = document.createElement('div');
      el.className = 'spot-marker';
      el.textContent = spot.index + 1;
      spotMarkerEls[spot.index] = el;
      new mapboxgl.Marker({ element: el }).setLngLat([spot.lng, spot.lat]).addTo(map);
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        if (navigationState.active || navigationState.route) stopNavigation();
        const selectedSpot = {
          index: spot.index,
          name: spot.name,
          coords: [spot.lng, spot.lat],
          description: spot.description,
          url: spot.url,
          embed: spot.embed,
          videos: spot.videos,
          textoExtra: spot.textoExtra
        };
        state.activeSpot = selectedSpot;
        renderSpotPanel(selectedSpot, lang);
      });
    });

    routeLegFeatures = buildStraightLegFeatures(spots);
    map.addSource(STATIC_ROUTE_TODO_SOURCE_ID, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: STATIC_ROUTE_TODO_LAYER_ID, type: 'line', source: STATIC_ROUTE_TODO_SOURCE_ID,
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': ACCENT_COLOR, 'line-width': 5, 'line-opacity': 1, 'line-emissive-strength': 1 }
    });
    map.addSource(STATIC_ROUTE_DONE_SOURCE_ID, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: STATIC_ROUTE_DONE_LAYER_ID, type: 'line', source: STATIC_ROUTE_DONE_SOURCE_ID,
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': VISITED_ROUTE_COLOR, 'line-width': 5, 'line-opacity': 1, 'line-emissive-strength': 1 }
    }, STATIC_ROUTE_TODO_LAYER_ID);
    updateStaticRouteLayers();

    const coords = spots.map(s => s.lng + ',' + s.lat).join(';');
    const dirUrl = 'https://api.mapbox.com/directions/v5/mapbox/walking/' + coords + '?geometries=geojson&overview=full&steps=true&access_token=' + MAPBOX_TOKEN;
    fetch(dirUrl)
      .then(r => r.json())
      .then(data => {
        const route = data.routes && data.routes[0];
        const legs = route && route.legs;
        if (!Array.isArray(legs) || !legs.length) return;

        routeLegFeatures = legs.map((leg, legIndex) => {
          const coordinates = [];
          (leg.steps || []).forEach((step) => {
            const stepCoords = step.geometry && step.geometry.coordinates;
            if (!Array.isArray(stepCoords)) return;
            stepCoords.forEach((c) => {
              const last = coordinates[coordinates.length - 1];
              if (last && last[0] === c[0] && last[1] === c[1]) return;
              coordinates.push(c);
            });
          });
          return {
            type: 'Feature',
            properties: { legIndex },
            geometry: { type: 'LineString', coordinates: coordinates.length ? coordinates : [[spots[legIndex].lng, spots[legIndex].lat], [spots[legIndex + 1].lng, spots[legIndex + 1].lat]] }
          };
        });
        updateStaticRouteLayers();
      })
      .catch(err => console.warn('Walking directions unavailable:', err));

    const geolocate = new mapboxgl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    });
    map.addControl(geolocate, 'bottom-right');
    geolocate.on('geolocate', (position) => {
      const coords = [position.coords.longitude, position.coords.latitude];
      if (!isValidCoordinates(coords)) return;
      navigationState.lastPosition = coords;
      navigationState.lastPositionAt = Date.now();
    });
    locateButton.addEventListener('click', () => {
      geolocate.trigger();
    });

    map.resize();
  });

  window.addEventListener('resize', () => {
    if (!map) return;
    map.resize();
    syncPanelLayout();
    if (navigationState.active && navigationState.route) {
      fitRouteBounds(navigationState.route.geometry.coordinates);
    }
  });
  setTimeout(() => map && map.resize(), 500);
}

init();
</script>
</body>
</html>
